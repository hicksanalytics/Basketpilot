name: Preview checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Receipts and product lookup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run receipt and product tests
        run: node --test tests/*.cjs
      - name: Run static preview smoke checks
        run: |
          python3 tests/smoke_test.py
          python3 tests/smoke_test_v07.py
          python3 tests/test_photo_picker.py
